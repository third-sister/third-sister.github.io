<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:#f5f7fa;color:#222;padding:40px 20px}
        .card{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 12px #00000014}
        .avatar{width:120px;height:120px;border-radius:50%;margin:0 auto 20px;display:block;object-fit:cover}
        h1{text-align:center;font-size:24px;margin-bottom:8px}
        .desc{text-align:center;color:#666;margin-bottom:24px;line-height:1.6}
        .link-item{display:block;text-decoration:none;color:#222;background:#f3f4f6;padding:14px 18px;border-radius:12px;margin:10px 0;transition:0.2s}
        .link-item:hover{background:#e9eaf0}
    </style>
</head>
<body>
    <div class="card">
        <!-- ===================== 个人配置区，这里随便改 ===================== -->
        <img class="avatar" src="https://xxx你的头像地址.jpg" alt="头像">
        <h1>你的名字</h1>
        <p class="desc">个人简介、一句话介绍，爱好、说明等</p>
        <a class="link-item" href="https://github.com/xxx">🔗 GitHub</a>
        <a class="link-item" href="https://xxx">📧 邮箱</a>
        <a class="link-item" href="https://xxx">🌐 其他链接</a>
        <!-- ============================================================== -->
    </div>
</body>
</html>
